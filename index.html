<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銘柄ランダム生成ツール 株みくじ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  color:#202735;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

main{
  max-width:560px;
  margin:65px auto;
  padding:24px;
}

header{
  text-align:center;
  margin-bottom:35px;
}

h1{
  font-size:27px;
  letter-spacing:1px;
  margin:0;
  line-height:1.6;
}

.panel{
  background:white;
  border:1px solid #e7e9ee;
  border-radius:18px;
  padding:38px 20px;
  text-align:center;
}

.label{
  font-size:11px;
  color:#929aa7;
  letter-spacing:2px;
}

#result-label{
  display:none;
}

#code{
  font-size:36px;
  font-weight:750;
  margin:16px 0 4px;
}

#name{
  font-size:21px;
  font-weight:650;
  min-height:32px;
}

#market{
  font-size:12px;
  color:#818b99;
  margin-top:12px;
}

/* 外部サイトボタン */

.site-links{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:24px;
}

.site-links a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  border-radius:10px;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:opacity .2s;
}

.site-links a:hover{
  opacity:.8;
}

.site-links a.disabled{
  opacity:.45;
  pointer-events:none;
}

.kabutan{
  background:#e8f0ff;
  color:#2459a6;
}

.yahoo{
  background:#fff0f0;
  color:#c52d36;
}

.nikkei{
  background:#e9e9e9;
  color:#222;
}

/* 抽選ボタン */

button{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:17px;
  background:#243650;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:24px;
}

button:hover{
  background:#304360;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.info{
  text-align:center;
  color:#929aa7;
  font-size:12px;
  line-height:1.8;
  margin-top:22px;
}

#error{
  color:#b64b4b;
  text-align:center;
  font-size:13px;
}

@media(max-width:600px){
  main{
    margin:30px auto;
    padding:18px;
  }

  h1{
    font-size:24px;
  }

  .site-links{
    gap:7px;
  }

  .site-links a{
    font-size:12px;
    min-height:48px;
  }

  .info{
    font-size:11px;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>
    銘柄ランダム生成ツール<br>
    株みくじ
  </h1>
</header>

<section class="panel">

  <div class="label" id="result-label">
    あなたの引いた銘柄はこれ！
  </div>

  <div id="code">????</div>

  <div id="name">
    銘柄を引いてください
  </div>

  <div id="market"></div>

</section>

<!-- 外部サイトリンク -->

<div class="site-links">

  <a id="kabutan"
     class="kabutan disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    株探
  </a>

  <a id="yahoo"
     class="yahoo disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    Yahoo!ファイナンス
  </a>

  <a id="nikkei"
     class="nikkei disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    日経
  </a>

</div>

<button id="draw" disabled>
  🎲 抽選する
</button>

<div class="info" id="status">
  銘柄データを読み込んでいます...
</div>

<div id="error"></div>

</main>

<script>

let stocks=[];

// 銘柄データ読み込み

async function loadStocks(){

  try{

    const response=await fetch("./stocks.json");

    if(!response.ok){
      throw new Error("銘柄データが見つかりません");
    }

    stocks=await response.json();

    if(!Array.isArray(stocks)||stocks.length===0){
      throw new Error("銘柄データが空です");
    }

    // 銘柄数表示

    document.getElementById("status").textContent=
      "2026年10月31日時点で東証プライム・スタンダード・グロースに上場の"+
      stocks.length.toLocaleString()+
      "銘柄。PRO Market、ETF、REIT等は除く。";

    document.getElementById("draw").disabled=false;

  }catch(e){

    document.getElementById("status").textContent=
      "データ読み込みエラー";

    document.getElementById("error").textContent=e.message;

  }

}

// 個別銘柄ページへのリンク設定

function setStockLinks(code){

  const encodedCode=encodeURIComponent(String(code));

  const links={

    kabutan:
      "https://kabutan.jp/stock/?code="+encodedCode,

    yahoo:
      "https://finance.yahoo.co.jp/quote/"+encodedCode+".T",

    nikkei:
      "https://www.nikkei.com/nkd/company/?scode="+encodedCode

  };

  Object.keys(links).forEach(id=>{

    const element=document.getElementById(id);

    element.href=links[id];

    element.classList.remove("disabled");

    element.removeAttribute("aria-disabled");

  });

}

// 抽選機能

document.getElementById("draw").addEventListener("click",()=>{

  if(!stocks.length)return;

  // ランダムに銘柄を選択

  const stock=stocks[
    Math.floor(Math.random()*stocks.length)
  ];

  // 抽選結果表示

  document.getElementById("result-label").style.display="block";

  document.getElementById("code").textContent=stock.code;

  document.getElementById("name").textContent=stock.name;

  document.getElementById("market").textContent=
    stock.market||"";

  // 3サイトの個別銘柄ページを設定

  setStockLinks(stock.code);

  // ボタン表示変更

  document.getElementById("draw").textContent=
    "🎲 もう一回引く";

});

// 起動

loadStocks();

</script>

</body>
</html>
