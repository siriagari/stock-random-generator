<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銘柄ランダム抽選ツール</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  color:#202735;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

main{
  max-width:560px;
  margin:65px auto;
  padding:24px;
}

header{
  text-align:center;
  margin-bottom:35px;
}

h1{
  font-size:27px;
  letter-spacing:1px;
  margin:0;
  line-height:1.6;
}

.panel{
  background:white;
  border:1px solid #e7e9ee;
  border-radius:18px;
  padding:38px 20px;
  text-align:center;
}

.label{
  font-size:11px;
  color:#929aa7;
  letter-spacing:2px;
}

#result-label{
  display:none;
}

#code{
  font-size:36px;
  font-weight:750;
  margin:16px 0 4px;
}

#name{
  font-size:21px;
  font-weight:650;
  min-height:32px;
}

#market{
  font-size:12px;
  color:#818b99;
  margin-top:12px;
}

/* 市場選択 */

.market-select{
  margin-top:24px;
  padding:17px;
  background:white;
  border:1px solid #e7e9ee;
  border-radius:12px;
}

.market-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:13px;
  text-align:center;
}

.market-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.market-option{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:11px 3px;
  background:#f5f6f8;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.market-option input{
  width:16px;
  height:16px;
  accent-color:#243650;
  cursor:pointer;
}

#filter-status{
  text-align:center;
  font-size:11px;
  color:#929aa7;
  margin-top:12px;
}

/* 外部サイトボタン */

.site-links{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:24px;
}

.site-links a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  border-radius:10px;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:opacity .2s;
}

.site-links a:hover{
  opacity:.8;
}

.site-links a.disabled{
  opacity:.45;
  pointer-events:none;
}

.kabutan{
  background:#e8f0ff;
  color:#2459a6;
}

.yahoo{
  background:#fff0f0;
  color:#c52d36;
}

.nikkei{
  background:#e9e9e9;
  color:#222;
}

.search-links{grid-template-columns:repeat(6,1fr);margin-top:12px;}
.search-links a{grid-column:span 2;}
.search-links a:first-child{grid-column:2 / 4;}
.search-links a:last-child{grid-column:4 / 6;}
.google{background:#e8f0fe;color:#1a73e8;}
.search-links a[hidden]{display:none;}

/* 下段の外部サイトボタンを大きくする */
.site-links:not(.search-links) a{
  min-height:100px;
  padding:12px 6px;
}

/* 抽選ボタン */

button{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:17px;
  background:#243650;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:24px;
}

button:hover{
  background:#304360;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.info{
  text-align:center;
  color:#929aa7;
  font-size:12px;
  line-height:1.8;
  margin-top:22px;
}

#error{
  color:#b64b4b;
  text-align:center;
  font-size:13px;
}

@media(max-width:600px){
  main{
    margin:30px auto;
    padding:18px;
  }

  h1{
    font-size:24px;
  }

  .site-links{
    gap:7px;
  }

  .site-links a{
    font-size:12px;
    min-height:48px;
  }

  .site-links:not(.search-links) a{
    min-height:88px;
  }

  .info{
    font-size:11px;
  }
}

/* スマホ向けコンパクト表示 */
@media (max-width:600px){
  main{margin:0 auto;padding:10px 12px;}
  header{margin-bottom:10px;}
  h1{font-size:20px;line-height:1.25;}
  .panel{padding:12px 10px;border-radius:12px;}
  #code{font-size:30px;margin:2px 0;}
  #name{font-size:18px;min-height:24px;}
  #market{margin-top:3px;}
  .search-links{margin-top:8px;}
  .search-links a{min-height:40px;}
  .market-select{margin-top:8px;padding:8px;}
  .market-title{margin-bottom:6px;}
  .market-option{padding:6px 2px;}
  .market-select>label{margin-top:4px!important;}
  #filter-status{margin-top:5px;}
  .site-links:not(.search-links){margin-top:8px;gap:6px;}
  .site-links:not(.search-links) a{min-height:72px;padding:5px 2px;}
  button{margin-top:8px;padding:12px;}
  .info{margin-top:6px;line-height:1.35;}
  #error:empty{display:none;}
}
@media (max-width:600px) and (max-height:650px){
  main{padding-top:6px;padding-bottom:6px;}
  h1{font-size:18px;}
  .panel{padding:7px;}
  .market-select{padding:5px;}
  .site-links:not(.search-links) a{min-height:64px;}
}

@media (max-width:600px) and (max-height:750px){
 main{padding:4px 8px;}
 header{margin-bottom:3px;}
 h1{font-size:16px;line-height:1.1;}
 .panel{padding:4px 6px;}
 #code{font-size:23px;margin:0;}
 #name{font-size:15px;min-height:18px;}
 #market{margin-top:0;}
 .search-links{margin-top:3px;}
 .search-links a{min-height:28px;}
 .market-select{margin-top:4px;padding:4px;}
 .market-option{padding:3px 2px;}
 #filter-status{margin-top:2px;}
 .site-links:not(.search-links){margin-top:4px;gap:4px;}
 .site-links:not(.search-links) a{min-height:38px;padding:2px 1px;}
 button{margin-top:4px;padding:8px;}
 .info{margin-top:3px;font-size:10px;line-height:1.15;}
}

@media (max-width:600px) and (max-height:750px){
 .site-links:not(.search-links) a{min-height:54px;}
 button{margin-top:14px;}
 .market-select{margin-top:7px;}
}
</style>
</head>

<body>

<main>

<header>
  <h1>
    銘柄ランダム抽選ツール<br>
    株みくじ
  </h1>
</header>

<!-- 抽選結果 -->

<section class="panel">

  <div class="label" id="result-label">
    あなたの引いた銘柄はこれ！
  </div>

  <div id="code">????</div>

  <div id="name">
    銘柄を引いてください
  </div>

  <div id="market"></div>
<div class="site-links search-links">
  <a id="yahoo-search" class="yahoo" target="_blank" rel="noopener noreferrer" hidden>Yahoo!JAPANで検索</a>
  <a id="google-search" class="google" target="_blank" rel="noopener noreferrer" hidden>Googleで検索</a>
</div>

</section>

<!-- 市場選択チェックボックス -->

<section class="market-select">
  <div class="market-options">
    <label class="market-option"><input type="checkbox" class="market-check" value="prime" checked>プライム</label>
    <label class="market-option"><input type="checkbox" class="market-check" value="standard" checked>スタンダード</label>
    <label class="market-option"><input type="checkbox" class="market-check" value="growth" checked>グロース</label>
  </div>

  <label class="market-option" style="margin-top:8px">
  <input type="checkbox" id="benefit-only">
  株主優待銘柄のみ
</label>

<div id="filter-status">
    3市場すべて選択中
  </div>

</section>

<!-- 外部サイトリンク -->

<div class="site-links">

  <a id="yahoo"
     class="yahoo disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    Yahoo!ファイナンス
  </a>

  <a id="kabutan"
     class="kabutan disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    株探
  </a>

  <a id="nikkei"
     class="nikkei disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    日経
  </a>
</div>

<!-- 抽選ボタン -->

<button id="draw" disabled>
  🎲 抽選する
</button>

<div class="info" id="status">
  銘柄データを読み込んでいます...
</div>

<div id="error"></div>

<div class="info" style="margin-top:4px">株主優待実施企業リストの出典: <a href="https://yutai-shirabe.com/download/index.html" target="_blank" rel="noopener noreferrer">優待しらべ</a>（2026年11月18日データ確認分。）</div>
</main>

<script>

let stocks=[];
let currentStock=null;


// JSONの市場・優待フラグで抽選対象を絞り込む
function getFilteredStocks(){
  const benefitOnly=document.getElementById("benefit-only").checked;
  const markets=[...document.querySelectorAll(".market-check:checked")].map(x=>x.value);
  const aliases={
    prime:["prime","プライム","東証プライム","東P","p"],
    standard:["standard","スタンダード","東証スタンダード","東S","s"],
    growth:["growth","グロース","東証グロース","東G","g"]
  };
  return stocks.filter(stock=>{
    const market=String(stock.market||"").trim().toLowerCase().replace(/市場$/,"");
    return markets.some(m=>aliases[m].some(v=>v.toLowerCase()===market))
      && (!benefitOnly || stock.benefit===true);
  });
}

function updateFilter(){
  const filtered=getFilteredStocks();
  const benefitOnly=document.getElementById("benefit-only").checked;
  document.getElementById("filter-status").textContent=
    (benefitOnly ? "株主優待銘柄のみ" : "全銘柄")+
    "（"+filtered.length.toLocaleString()+"銘柄）";
  document.getElementById("draw").disabled=filtered.length===0;
  if(currentStock) renderStock(currentStock);
}

// 銘柄データ読み込み

async function loadStocks(){

  try{

    const response=await fetch("./stocks.json");

    if(!response.ok){
      throw new Error("銘柄データが見つかりません");
    }

    stocks=await response.json();

    if(!Array.isArray(stocks)||stocks.length===0){
      throw new Error("銘柄データが空です");
    }

    // 全登録銘柄数を表示

    document.getElementById("status").textContent=
      "2026年10月31日時点で東証プライム・スタンダード・グロースに上場の"+
      stocks.length.toLocaleString()+
      "銘柄。PRO Market、ETF、REIT等は除く。";

    updateFilter();

  }catch(e){

    document.getElementById("status").textContent=
      "データ読み込みエラー";

    document.getElementById("error").textContent=e.message;

  }

}

// 個別銘柄ページへのリンク設定

function setStockLinks(code){

  const encodedCode=encodeURIComponent(String(code));

  const links={

    yahoo:
      "https://finance.yahoo.co.jp/quote/"+encodedCode+".T",

    kabutan:
      "https://kabutan.jp/stock/?code="+encodedCode,

    nikkei:
      "https://www.nikkei.com/nkd/company/?scode="+encodedCode
  };

  Object.keys(links).forEach(id=>{

    const element=document.getElementById(id);

    element.href=links[id];

    element.classList.remove("disabled");

    element.removeAttribute("aria-disabled");

  });

}

// チェックボックス変更時

document.querySelectorAll("#benefit-only, .market-check").forEach(input=>{

  input.addEventListener("change",updateFilter);

});

// 抽選機能

document.getElementById("draw").addEventListener("click",()=>{

  const filteredStocks=getFilteredStocks();

  if(!filteredStocks.length)return;

  // 選択市場の中からランダムに抽選

  const stock=filteredStocks[
    Math.floor(Math.random()*filteredStocks.length)
  ];

  currentStock=stock;
  renderStock(stock);
});

// 抽選結果は条件変更時にも維持する
function renderStock(stock){
  document.getElementById("result-label").style.display="block";
  document.getElementById("code").textContent=stock.code;
  document.getElementById("name").textContent=stock.name;
  const searchQuery=encodeURIComponent(String(stock.name));
  const yahooSearch=document.getElementById("yahoo-search");
  const googleSearch=document.getElementById("google-search");
  yahooSearch.href="https://search.yahoo.co.jp/search?p="+searchQuery;
  googleSearch.href="https://www.google.com/search?q="+searchQuery;
  yahooSearch.hidden=false;
  googleSearch.hidden=false;
  document.getElementById("market").textContent=stock.market||"";
  setStockLinks(stock.code);
  document.getElementById("draw").textContent="🎲 もう一回引く";
}

// 起動

loadStocks();

</script>

</body>
</html>
