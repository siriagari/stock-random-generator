<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銘柄ランダム生成ツール 株みくじ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  color:#202735;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

main{
  max-width:560px;
  margin:65px auto;
  padding:24px;
}

header{
  text-align:center;
  margin-bottom:35px;
}

h1{
  font-size:27px;
  letter-spacing:1px;
  margin:0;
  line-height:1.6;
}

.panel{
  background:white;
  border:1px solid #e7e9ee;
  border-radius:18px;
  padding:38px 20px;
  text-align:center;
}

.label{
  font-size:11px;
  color:#929aa7;
  letter-spacing:2px;
}

#result-label{
  display:none;
}

#code{
  font-size:36px;
  font-weight:750;
  margin:16px 0 4px;
}

#name{
  font-size:21px;
  font-weight:650;
  min-height:32px;
}

#market{
  font-size:12px;
  color:#818b99;
  margin-top:12px;
}

/* 市場選択 */

.market-select{
  margin-top:24px;
  padding:17px;
  background:white;
  border:1px solid #e7e9ee;
  border-radius:12px;
}

.market-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:13px;
  text-align:center;
}

.market-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.market-option{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:11px 3px;
  background:#f5f6f8;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.market-option input{
  width:16px;
  height:16px;
  accent-color:#243650;
  cursor:pointer;
}

#filter-status{
  text-align:center;
  font-size:11px;
  color:#929aa7;
  margin-top:12px;
}

/* 外部サイトボタン */

.site-links{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:24px;
}

.site-links a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  border-radius:10px;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:opacity .2s;
}

.site-links a:hover{
  opacity:.8;
}

.site-links a.disabled{
  opacity:.45;
  pointer-events:none;
}

.kabutan{
  background:#e8f0ff;
  color:#2459a6;
}

.yahoo{
  background:#fff0f0;
  color:#c52d36;
}

.nikkei{
  background:#e9e9e9;
  color:#222;
}

/* 抽選ボタン */

button{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:17px;
  background:#243650;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:24px;
}

button:hover{
  background:#304360;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.info{
  text-align:center;
  color:#929aa7;
  font-size:12px;
  line-height:1.8;
  margin-top:22px;
}

#error{
  color:#b64b4b;
  text-align:center;
  font-size:13px;
}

@media(max-width:600px){
  main{
    margin:30px auto;
    padding:18px;
  }

  h1{
    font-size:24px;
  }

  .site-links{
    gap:7px;
  }

  .site-links a{
    font-size:12px;
    min-height:48px;
  }

  .info{
    font-size:11px;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>
    銘柄ランダム生成ツール<br>
    株みくじ
  </h1>
</header>

<!-- 抽選結果 -->

<section class="panel">

  <div class="label" id="result-label">
    あなたの引いた銘柄はこれ！
  </div>

  <div id="code">????</div>

  <div id="name">
    銘柄を引いてください
  </div>

  <div id="market"></div>

</section>

<!-- 市場選択チェックボックス -->

<section class="market-select">

  <div class="market-title">
    抽選する市場を選択
  </div>

  <div class="market-options">

    <label class="market-option">
      <input type="checkbox"
             class="market-check"
             value="prime"
             checked>
      プライム
    </label>

    <label class="market-option">
      <input type="checkbox"
             class="market-check"
             value="standard"
             checked>
      スタンダード
    </label>

    <label class="market-option">
      <input type="checkbox"
             class="market-check"
             value="growth"
             checked>
      グロース
    </label>

  </div>

  <label class="market-option" style="margin-top:8px">
  <input type="checkbox" id="benefit-only">
  株主優待銘柄のみ
</label>

<div id="filter-status">
    3市場すべて選択中
  </div>

</section>

<!-- 外部サイトリンク -->

<div class="site-links">

  <a id="yahoo"
     class="yahoo disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    Yahoo!ファイナンス
  </a>

  <a id="kabutan"
     class="kabutan disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    株探
  </a>

  <a id="nikkei"
     class="nikkei disabled"
     href="#"
     target="_blank"
     rel="noopener noreferrer"
     aria-disabled="true">
    日経
  </a>

</div>

<!-- 抽選ボタン -->

<button id="draw" disabled>
  🎲 抽選する
</button>

<div class="info" id="status">
  銘柄データを読み込んでいます...
</div>

<div id="error"></div>

</main>

<script>

let stocks=[];

// 市場選択状態を取得

function getSelectedMarkets(){

  return Array.from(
    document.querySelectorAll(".market-check:checked")
  ).map(input=>input.value);

}

// 銘柄の市場を判定

function getStockMarket(stock){

  const market=String(stock.market||"").toLowerCase();

  if(
    market.includes("プライム") ||
    market.includes("東p") ||
    market.includes("prime")
  ){
    return "prime";
  }

  if(
    market.includes("スタンダード") ||
    market.includes("東s") ||
    market.includes("standard")
  ){
    return "standard";
  }

  if(
    market.includes("グロース") ||
    market.includes("東g") ||
    market.includes("growth")
  ){
    return "growth";
  }

  return null;

}

// 選択された市場の銘柄を取得

function getFilteredStocks(){

  const selected=getSelectedMarkets();

  const benefitOnly=document.getElementById("benefit-only").checked;

  return stocks.filter(stock=>{
    return selected.includes(getStockMarket(stock)) &&
      (!benefitOnly || stock.benefit===true);
  });
}

// 抽選対象数とボタン状態を更新

function updateFilter(){

  const selected=getSelectedMarkets();

  const filtered=getFilteredStocks();

  const status=document.getElementById("filter-status");

  const draw=document.getElementById("draw");

  if(selected.length===0){

    status.textContent="市場を1つ以上選択してください";

  }else if(selected.length===3){

    status.textContent=
      "3市場すべて選択中（"+
      filtered.length.toLocaleString()+
      "銘柄）";

  }else{

    const names={
      prime:"プライム",
      standard:"スタンダード",
      growth:"グロース"
    };

    status.textContent=
      selected.map(value=>names[value]).join("・")+
      "（"+
      filtered.length.toLocaleString()+
      "銘柄）";

  }

  if(document.getElementById("benefit-only").checked){
    status.textContent+="・株主優待銘柄のみ";
  }
  draw.disabled=filtered.length===0;

}

// 銘柄データ読み込み

async function loadStocks(){

  try{

    const response=await fetch("./stocks.json");

    if(!response.ok){
      throw new Error("銘柄データが見つかりません");
    }

    stocks=await response.json();

    if(!Array.isArray(stocks)||stocks.length===0){
      throw new Error("銘柄データが空です");
    }

    // 全登録銘柄数を表示

    document.getElementById("status").textContent=
      "2026年10月31日時点で東証プライム・スタンダード・グロースに上場の"+
      stocks.length.toLocaleString()+
      "銘柄。PRO Market、ETF、REIT等は除く。";

    updateFilter();

  }catch(e){

    document.getElementById("status").textContent=
      "データ読み込みエラー";

    document.getElementById("error").textContent=e.message;

  }

}

// 個別銘柄ページへのリンク設定

function setStockLinks(code){

  const encodedCode=encodeURIComponent(String(code));

  const links={

    yahoo:
      "https://finance.yahoo.co.jp/quote/"+encodedCode+".T",

    kabutan:
      "https://kabutan.jp/stock/?code="+encodedCode,

    nikkei:
      "https://www.nikkei.com/nkd/company/?scode="+encodedCode

  };

  Object.keys(links).forEach(id=>{

    const element=document.getElementById(id);

    element.href=links[id];

    element.classList.remove("disabled");

    element.removeAttribute("aria-disabled");

  });

}

// チェックボックス変更時

document.querySelectorAll(".market-check, #benefit-only").forEach(input=>{

  input.addEventListener("change",updateFilter);

});

// 抽選機能

document.getElementById("draw").addEventListener("click",()=>{

  const filteredStocks=getFilteredStocks();

  if(!filteredStocks.length)return;

  // 選択市場の中からランダムに抽選

  const stock=filteredStocks[
    Math.floor(Math.random()*filteredStocks.length)
  ];

  // 抽選結果表示

  document.getElementById("result-label").style.display="block";

  document.getElementById("code").textContent=stock.code;

  document.getElementById("name").textContent=stock.name;

  document.getElementById("market").textContent=
    stock.market||"";

  // 3サイトの個別銘柄ページを設定

  setStockLinks(stock.code);

  // ボタン表示変更

  document.getElementById("draw").textContent=
    "🎲 もう一回引く";

});

// 起動

loadStocks();

</script>

</body>
</html>
